<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>급식실 대기 시간 안내</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding-top: 100px;
        }
        .box {
            display: inline-block;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .time {
            font-size: 2em;
            color: #e74c3c;
        }
        .sensor {
            margin-top: 10px;
            font-size: 1.2em;
            color: #555;
        }
        .update {
            margin-top: 20px;
            color: gray;
        }
    </style>
    <meta http-equiv="refresh" content="5">
</head>
<body>
    <div class="box">
        {% if info.sensor %}
            <div class="sensor">감지된 위치: {{ info.sensor }}</div>
            <div class="time">예상 대기 시간: {{ info.time }}분</div>
        {% else %}
            <div class="time">사람이 없습니다</div>
        {% endif %}
        <div class="update">최종 업데이트: {{ info.last_updated }}</div>
    </div>
</body>
</html>
