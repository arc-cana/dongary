<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 스탬프 프로그램</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>우리 반 스탬프</h1>

        <div class="qr-scanner">
            <video id="qr-video" autoplay playsinline></video>
            <div id="qr-result">QR 코드를 스캔 중...</div>
        </div>

        <div class="stamp-grid">
            <img src="images/stamp_hidden.png" alt="1반 스탬프" class="stamp hidden" id="stamp1">
            <img src="images/stamp_hidden.png" alt="2반 스탬프" class="stamp hidden" id="stamp2">
            <img src="images/stamp_hidden.png" alt="3반 스탬프" class="stamp hidden" id="stamp3">
            <img src="images/stamp_hidden.png" alt="4반 스탬프" class="stamp hidden" id="stamp4">
            <img src="images/stamp_hidden.png" alt="5반 스탬프" class="stamp hidden" id="stamp5">
            <img src="images/stamp_hidden.png" alt="6반 스탬프" class="stamp hidden" id="stamp6">
            <img src="images/stamp_hidden.png" alt="7반 스탬프" class="stamp hidden" id="stamp7">
            <img src="images/stamp_hidden.png" alt="8반 스탬프" class="stamp hidden" id="stamp8">
            <img src="images/stamp_hidden.png" alt="9반 스탬프" class="stamp hidden" id="stamp9">
            <img src="images/stamp_hidden.png" alt="10반 스탬프" class="stamp hidden" id="stamp10">
        </div>

        <div class="controls">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
